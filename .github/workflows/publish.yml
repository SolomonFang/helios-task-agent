name: Publish to npm

# 打 tag 触发：git tag v1.0.1 && git push origin v1.0.1
# tag 必须与 package.json 的 version 一致；预发布 tag（含 -，如 v1.1.0-beta.0）发布到 npm 的 next 频道
# smoke / e2e 依赖本机 helios-kanban，不在 CI 跑；发布前请本地执行 npm run verify
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ]

      # npm publish 会执行 prepublishOnly（typecheck）和 prepack（build）
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
